<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#gold)" stroke-width="10" stroke-dasharray="18 10"/>
  <!-- Back card (Copas) -->
  <g transform="translate(150 110) rotate(-12)">
    <rect width="175" height="255" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="6"/>
    <text x="22" y="46" font-family="Georgia, serif" font-size="34" font-weight="900" fill="#be123c">10</text>
    <text x="87" y="160" text-anchor="middle" font-size="90">🏆</text>
  </g>
  <!-- Front card (As de Oros) -->
  <g transform="translate(205 125) rotate(10)">
    <rect width="185" height="265" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="7"/>
    <text x="22" y="48" font-family="Georgia, serif" font-size="36" font-weight="900" fill="#b45309">1</text>
    <circle cx="92" cy="145" r="54" fill="url(#gold)" stroke="#92400e" stroke-width="6"/>
    <circle cx="92" cy="145" r="36" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="92" y="162" text-anchor="middle" font-size="44">☀️</text>
  </g>
  <!-- Banner -->
  <rect x="64" y="395" width="384" height="62" rx="16" fill="#be123c" stroke="#fde047" stroke-width="4"/>
  <text x="256" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="900" fill="#fef08a" letter-spacing="3">CONQUIÁN</text>
</svg>
